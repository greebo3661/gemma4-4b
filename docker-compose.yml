services:
  gemma4-4b-llm:
    build: .
    container_name: gemma4-4b-llm
    ports:
      - "5003:8080"
    volumes:
      - ./model:/models:ro
    environment:
      MODEL_PATH: /models/QAT/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      HOST: 0.0.0.0
      PORT: 8080
      N_CTX: "16384"
      N_GPU_LAYERS: "-1"
      N_THREADS: "8"
      TEMPERATURE: "0.7"
      TOP_P: "0.9"
      TOP_K: "64"
      REPEAT_PENALTY: "1.1"
      LLM_ENABLE_THINKING: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
